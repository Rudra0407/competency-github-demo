<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Competency Demo</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Competency Demo: GitHub Workflows</h1>
    <button id="themeToggle">Toggle Theme</button>
  </header>

  <main>
    <p id="desc">Feature branch adds different message from CONFLICT DEMO.</p>

    <section id="contactSection">
  <h2>Contact</h2>
  <form id="contactForm" novalidate>
    <label>Name: <input type="text" id="name"/></label><br/>
    <label>Email: <input type="email" id="email"/></label><br/>
    <label>Message:<br/>
      <textarea id="message" maxlength="500"></textarea>
    </label><br/>
    <p><small id="charCount">0/500</small></p>
    <button type="submit">Send</button>
  </form>
  <p id="contactMsg" aria-live="polite"></p>
</section>
  </main>

  <script src="script.js"></script>
</body>
</html>
